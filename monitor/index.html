<title>Monitor</title>
<script>
  // Apply the stored theme before the stylesheet renders so the first paint is
  // already themed. Unknown or missing ids fall back to Matrix; every storage
  // access is wrapped because the page must work without localStorage.
  (function () {
    var ids = ["matrix"];
    var id = null;
    try {
      id = window.localStorage.getItem("fleet-monitor.theme");
    } catch (error) {
      id = null;
    }
    document.documentElement.setAttribute("data-theme", ids.indexOf(id) === -1 ? "matrix" : id);
  })();
</script>
<style>

    --border: rgba(var(--live-rgb), 0.32);
    --on-warn: #000;
    --on-crit: #fff;
    --mask-fill: #fff;
    --scanline: rgba(var(--live-rgb), 0.05);
    --scrollbar: rgba(var(--dim-rgb), 0.6);
    --scrollbar-thumb: rgba(var(--dim-rgb), 0.55);
    --tron-head-rgb: 255, 255, 255;
    --glow-title: drop-shadow(0 0 6px rgba(var(--live-rgb), 0.55));
    --glow-live: 0 0 6px rgba(var(--live-rgb), 0.45);
    --glow-work: 0 0 7px rgba(var(--work-rgb), 0.5);
    --glow-done: 0 0 7px rgba(var(--live-rgb), 0.45);
    --glow-error: 0 0 7px rgba(var(--err-rgb), 0.4);
    --glow-waiting: 0 0 7px rgba(var(--wait-rgb), 0.4);
    --glow-stale: 0 0 7px rgba(var(--stale-rgb), 0.4);
    --glow-commit: 0 0 5px rgba(var(--live-rgb), 0.4);
    --glow-done-static: 0 0 9px rgba(var(--live-rgb), 0.45), inset 0 0 7px rgba(var(--live-rgb), 0.22);
    --glow-error-static: 0 0 9px rgba(var(--err-rgb), 0.45), inset 0 0 7px rgba(var(--err-rgb), 0.22);
    --rain-glyph: rgba(var(--live-rgb), 0.85);
    --rain-trail: rgba(0, 0, 0, 0.08);
    --rain-font: 15px 'MS Gothic', 'Yu Gothic', monospace;

    --branch-4: #9dff4d;
    --branch-5: #ff5555;
    --branch-6: #5fe8e8;
    --branch-7: #c792ea;
    --branch-neutral: #00a333;

    --code-keyword: #00ff41;
    --code-string: #ffb000;
    --code-comment: #00a333;
    --code-number: #57d7ff;
    --code-function: #9dff4d;
    --code-added-bg: rgba(var(--live-rgb), 0.14);
    --code-removed-bg: rgba(var(--err-rgb), 0.14);
    --ansi-0: #0a0f0a;
    --ansi-1: #ff5555;
    --ansi-2: #4dff7a;
    --ansi-3: #ffb000;
    --ansi-4: #57a7ff;
    --ansi-5: #c792ea;
    --ansi-6: #5fe8e8;
    --ansi-7: #b8e6c2;
    --ansi-8: #4a6b52;
    --ansi-9: #ff7777;
    --ansi-10: #7dffa0;
    --ansi-11: #ffd066;
    --ansi-12: #7dbaff;
    --ansi-13: #ddaaff;
    --ansi-14: #8ff5f5;
    --ansi-15: #e6ffe9;
    --font: "Cascadia Mono", Consolas, "Courier New", monospace;
    --font-display: "Share Tech Mono", "Cascadia Mono", Consolas, monospace;
  }

    --scrollbar: rgba(var(--dim-rgb), 0.6);

    --tron-head-rgb: 255, 255, 255;
    --glow-title: drop-shadow(0 0 6px rgba(var(--live-rgb), 0.55));
    --glow-live: 0 0 6px rgba(var(--live-rgb), 0.45);
    --glow-work: 0 0 7px rgba(var(--work-rgb), 0.5);
    --glow-done: 0 0 7px rgba(var(--live-rgb), 0.45);
    --glow-error: 0 0 7px rgba(var(--err-rgb), 0.4);
    --glow-waiting: 0 0 7px rgba(var(--wait-rgb), 0.4);
    --glow-stale: 0 0 7px rgba(var(--stale-rgb), 0.4);
    --glow-commit: 0 0 5px rgba(var(--live-rgb), 0.4);
    --glow-done-static: 0 0 9px rgba(var(--live-rgb), 0.45), inset 0 0 7px rgba(var(--live-rgb), 0.22);
    --glow-error-static: 0 0 9px rgba(var(--err-rgb), 0.45), inset 0 0 7px rgba(var(--err-rgb), 0.22);
    --rain-glyph: rgba(var(--live-rgb), 0.85);
    --rain-trail: rgba(0, 0, 0, 0.08);

    --branch-5: #ff5555;
    --branch-6: #5fe8e8;
    --branch-7: #c792ea;
    --branch-neutral: #00a333;
    --code-bg: #020a04;
    --code-text: #c9f5d4;
    --code-keyword: #00ff41;
    --code-string: #ffb000;
    --code-comment: #00a333;
    --code-number: #57d7ff;

    --ansi-3: #ffb000;
    --ansi-4: #57a7ff;

    --ansi-15: #e6ffe9;
    --font: "Cascadia Mono", Consolas, "Courier New", monospace;
    --font-display: "Share Tech Mono", "Cascadia Mono", Consolas, monospace;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.35;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: repeating-linear-gradient(0deg, var(--scanline) 0 1px, transparent 1px 3px);
  }
  #rain {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.10;
    pointer-events: none;
  }
  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }
  .topbar {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
  }
  .topbar-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    min-width: 0;
  }
  /* Film-style title: the Matrix logo is Times capitals, widely tracked and
     sliced by thin horizontal lines. */
  h1 {
    margin: 0;
    font-family: "Times New Roman", Times, serif;
    font-weight: normal;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: transparent;
    background: repeating-linear-gradient(to bottom, var(--live) 0 3px, transparent 3px 4px);
    -webkit-background-clip: text;
    background-clip: text;
    filter: var(--glow-title);
  }
  .dim { color: var(--dim); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .stamp { color: var(--dim); font-size: 11px; }
  .link { font-size: 11px; }
  .link-up { color: var(--live); text-shadow: var(--glow-live); }
  .link-down { color: var(--warn); }
  /* Project picker: same palette as the rest of the header, compact enough to
     share the top line with the title and the meters. */
  .project-picker { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .project-picker select {
    min-width: 0;
    max-width: 220px;
    background: var(--panel);
    color: var(--live);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 4px;
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1px;
  }
  .project-picker select:hover { border-color: var(--live); }
  .theme-picker select { max-width: 140px; }
  /* Background switch: same compact style as the pickers, with the on/off
     state readable from the label itself and from aria-pressed. */
  .bg-toggle {
    background: var(--panel);
    color: var(--live);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 6px;
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .bg-toggle:hover { border-color: var(--live); }
  .bg-toggle[aria-pressed="false"] { color: var(--dim); }
  .orch { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; }
  .orch-engine { color: var(--live); font-size: 13px; text-shadow: var(--glow-live); }
  .orch-model { color: var(--text); font-size: 12px; overflow-wrap: anywhere; }
  .usage { display: grid; gap: 3px; min-width: 0; }
  .usage-row { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; }
  .usage-label { font-family: var(--font-display); color: var(--live); letter-spacing: 1px; min-width: 96px; }
  .usage-stale .usage-label { color: var(--dim); }
  .usage-stale .seg-on { opacity: 0.35; }
  .meter-label { color: var(--dim); font-size: 10.5px; }
  .usage-reset { color: var(--dim); }
  .usage-age { margin-left: auto; color: var(--dim); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: inline-flex; gap: 1px; }
  .seg { width: 7px; height: 13px; background: rgba(var(--live-rgb), 0.12); }
  .bar-warn .seg { background: rgba(var(--warn-rgb), 0.14); }
  .bar-crit .seg { background: rgba(var(--err-rgb), 0.14); }
  .bar-ok .seg-on { background: var(--live); }
  .bar-warn .seg-on { background: var(--warn); }
  .bar-crit .seg-on { background: var(--err); }
  .pct { min-width: 32px; }
  .pc { display: inline-flex; align-items: center; gap: 4px 10px; font-size: 11px; }
  .pc-label { color: var(--live); letter-spacing: 1px; }
  .pc-item { color: var(--dim); }
  .pc-value.pc-ok { color: var(--live); }
  .pc-value.pc-warn { color: var(--warn); }
  .pc-value.pc-crit { color: var(--err); }
  /* Warning and critical meters read as filled chips, like the terminal board. */
  .pc-item:has(.pc-warn) { background: var(--warn); color: var(--on-warn); padding: 0 5px; }
  .pc-item:has(.pc-crit) { background: var(--err); color: var(--on-crit); padding: 0 5px; animation: crit-blink 1.2s steps(2, jump-none) infinite; }
  .pc-item:has(.pc-warn) .pc-value,
  .pc-item:has(.pc-crit) .pc-value { color: inherit; animation: none; }
  /* Critical PC and usage meters blink slowly (about once a second) to flag urgency. */
  .pc-value.pc-crit,
  .bar-crit .seg-on { animation: crit-blink 1.2s steps(2, jump-none) infinite; }
  @keyframes crit-blink { 0% { opacity: 1; } 100% { opacity: 0.25; } }
  .blink-alert { animation: crit-blink 1.2s steps(2, jump-none) infinite; }
  .notices { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; }
  .notice {
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    overflow-wrap: anywhere;
  }
  .section-title {
    flex: 0 0 auto;
    margin: 0;
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--live);
    text-shadow: var(--glow-live);
  }
  /* The hidden-cards note is a real button, but it stays as discreet as the
     dim text it replaced. */
  .hidden-toggle {
    background: none;
    border: 0;
    padding: 0;
    color: var(--dim);
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
  }
  .hidden-toggle:hover { color: var(--text); }
  .workers {
    flex: 0 0 auto;
    min-height: 0;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 6px;
    align-content: start;
  }
  .worker {
    position: relative;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--panel);
    padding: 5px 8px;
  }
  .worker.state-working { border-color: rgba(var(--work-rgb), 0.5); }
  .worker.state-done { border-color: rgba(var(--live-rgb), 0.55); --tron-rgb: var(--live-rgb); }
  .worker.state-error { border-color: rgba(var(--err-rgb), 0.6); --tron-rgb: var(--err-rgb); }
  .worker.state-waiting { border-color: rgba(var(--wait-rgb), 0.5); }
  .worker.state-stale { border-color: rgba(var(--stale-rgb), 0.55); }
  .worker-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
    font-family: var(--font-display);
  }
  .identity { color: var(--text); }
  .worker-head .task { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .worker-head .eta { color: var(--dim); margin-left: auto; font-size: 14px; }
  .state-working .identity,
  .state-working .task,
  .state-working .eta { color: var(--work); text-shadow: var(--glow-work); }
  .state-done .identity,
  .state-done .task,
  .state-done .eta { color: var(--live); text-shadow: var(--glow-done); }
  .state-error .identity,
  .state-error .task { color: var(--err); text-shadow: var(--glow-error); }
  .state-error .eta { color: var(--err); text-shadow: none; }
  .state-waiting .identity,
  .state-waiting .task,
  .state-waiting .eta { color: var(--wait); text-shadow: var(--glow-waiting); }
  .state-stale .identity,
  .state-stale .task,
  .state-stale .eta { color: var(--stale); text-shadow: var(--glow-stale); }
  /* Tron border: a bright head runs around the card border followed by a short
     trail of dots. Finished (green) and error (red) cards only; reduced motion
     swaps it for a static glow. */
  .worker.state-done::before,
  .worker.state-error::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: inherit;
    padding: 1.4px;
    pointer-events: none;
    background: conic-gradient(from var(--tron-angle),
      rgba(var(--tron-head-rgb), 0.92) 0deg 1.4deg,
      rgba(var(--tron-rgb), 0.95) 1.4deg 5.6deg,
      transparent 5.6deg 8deg,
      rgba(var(--tron-rgb), 0.55) 8deg 10.4deg,
      transparent 10.4deg 12.8deg,
      rgba(var(--tron-rgb), 0.4) 12.8deg 14.8deg,
      transparent 14.8deg 17.2deg,
      rgba(var(--tron-rgb), 0.28) 17.2deg 18.8deg,
      transparent 18.8deg 21deg,
      rgba(var(--tron-rgb), 0.17) 21deg 22.2deg,
      transparent 22.2deg 360deg);
    -webkit-mask: linear-gradient(var(--mask-fill) 0 0) content-box, linear-gradient(var(--mask-fill) 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(var(--mask-fill) 0 0) content-box, linear-gradient(var(--mask-fill) 0 0);
    mask-composite: exclude;
    animation: tron-border 3.8s linear infinite;
  }
  @keyframes tron-border {
    to { --tron-angle: 360deg; }
  }
  .worker-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 10.5px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
  }
  .worker-meta .model { overflow: hidden; text-overflow: ellipsis; }
  /* Short line next to the model + effort: it repeats the colour the git tree
     uses for this worker's branch lane, so a card matches its branch at a
     glance. A branch with no lane in the tree keeps the neutral dim. */
  .worker-meta .branch-swatch {
    flex: 0 0 auto;
    align-self: center;
    width: 48px;
    height: 3px;
    border-radius: 2px;
    background: var(--dim);
  }
  .badge { padding: 0 5px; border: 1px solid currentColor; border-radius: 3px; font-size: 10px; }
  .badge-working { color: var(--work); }
  .badge-done { color: var(--live); }
  .badge-error { color: var(--err); }
  .badge-waiting { color: var(--wait); }
  .badge-stale { color: var(--stale); }
  .badge-hidden { color: var(--dim); }
  /* Hidden finished cards, shown on demand: dimmed and marked as "oculta". */
  .worker.worker-hidden { opacity: 0.62; }
  .worker-commit { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .worker-commit .subject { color: var(--text); }
  .worker-summary {
    margin-top: 2px;
    font-size: 10.5px;
    font-style: italic;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .events { list-style: none; margin: 3px 0 0; padding: 0; }
  .event {
    display: grid;
    grid-template-columns: 50px 42px minmax(0, 1fr);
    gap: 4px;
    font-size: 10.5px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .event > span { overflow: hidden; text-overflow: ellipsis; }
  .event .ts, .event .kind { color: var(--dim); }
  .event .detail { color: var(--text); }
  .event.kind-ERR .kind, .event.kind-ERR .detail { color: var(--err); }
  .event.kind-COMMIT .kind, .event.kind-COMMIT .detail { color: var(--live); text-shadow: var(--glow-commit); }
  /* The tree takes every free pixel below the worker cards (at least 32vh), with
     its own scrollbar so the 200-commit history is browsable while the page never scrolls. */
  .git {
    flex: 1 1 auto;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--card);
    padding: 5px 8px 4px;
  }
  .git h2 {
    flex: 0 0 auto;
    margin: 0 0 2px;
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--live);
    text-shadow: var(--glow-live);
  }
  .git-body {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }
  .git-body::-webkit-scrollbar { width: 9px; }
  .git-body::-webkit-scrollbar-track { background: transparent; }
  .git-body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 5px; }
  #git-lines { position: absolute; top: 0; left: 0; }
  .commits { list-style: none; margin: 0; padding: 0 0 0 var(--graph-w, 0px); }
  .commit { display: flex; align-items: center; gap: 6px; height: 22px; font-size: 11.5px; white-space: nowrap; }
  .commit .sha { color: var(--dim); }
  .commit .subject { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .commit .time { color: var(--dim); padding-left: 8px; }
  .chip { border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; font-size: 10px; line-height: 1.5; }
  .chip-head { color: var(--live); text-shadow: var(--glow-live); }
  .chip-tag { color: var(--warn); }
  .chip-remote { color: var(--dim); }
  .chip-branch { color: var(--text); }
  .git-empty, .empty { color: var(--dim); font-size: 11px; margin: 0; }
  /* Card mode: with little free space left the tree stops being a full-width
     panel and becomes the first card of the workers grid, matching a worker
     card. The graph and the ref chips are hidden and rows get compact, but the
     newest commits stay browsable with the card's own scroll. `contain: size`
     keeps the long commit list from inflating its grid row; the mode decision
     (with hysteresis) lives in the git-layout-logic script block. */
  .workers > .git {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--panel);
    padding: 5px 8px;
    min-width: 0;
    min-height: 140px;
    overflow: hidden;
    contain: size;
  }
  .workers > .git h2 { margin-bottom: 1px; }
  .workers > .git #git-lines { display: none; }
  .workers > .git .commits { padding-left: 0; }
  .workers > .git .commit { height: 20px; font-size: 11px; }
  .workers > .git .commit .chip { display: none; }
  /* A card leaves the grid flow only while the page measures the free space. */
  .git.is-measuring { position: absolute; visibility: hidden; left: 0; right: 0; }
  @keyframes commit-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes node-flash {
    0% { filter: drop-shadow(0 0 0 rgba(var(--live-rgb), 0)); }
    35% { filter: drop-shadow(0 0 7px rgba(var(--live-rgb), 0.95)); }
    100% { filter: drop-shadow(0 0 0 rgba(var(--live-rgb), 0)); }
  }
  .commit.is-new { animation: commit-in 260ms ease-out both; }
  .node.is-new { animation: node-flash 900ms ease-out both; }
  /* Live viewer: replays the typed agent steps under a worker card. The panel
     keeps one visible content area and swaps the per-tab content node, so a
     poll never restarts an animation. Every colour comes from a token. */
  .live-toggle {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--live);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 5px;
    font-family: var(--font-display);
    font-size: 10.5px;
    line-height: 1.5;
    letter-spacing: 1px;
    cursor: pointer;
  }

  .live-toggle[aria-expanded="true"] { color: var(--work); }
  .live-viewer {

    padding-top: 3px;
    border-top: 1px dashed var(--border);
    min-width: 0;
  }
  .live-viewer[hidden] { display: none; }
  /* The viewer keeps a fixed size so the cards never jump while steps play:
     the tab strip has room for three rows (it scrolls past that) and the body
     has a fixed height with its own scroll. */
  .live-tabs {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: center;
    gap: 3px;
    min-width: 0;
    height: 62px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }
  .live-tab-box { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; min-width: 0; }
  .live-tab,
  .live-follow,
  .live-skip,
  .live-collapse {
    background: var(--panel);
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 5px;
    font-family: var(--font-display);
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    cursor: pointer;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .live-tab:hover,
  .live-follow:hover,
  .live-skip:hover,
  .live-collapse:hover { border-color: var(--live); }
  .live-tab.status-running { color: var(--work); }
  .live-tab.status-done { color: var(--live); }
  .live-tab.status-error { color: var(--err); }
  .live-tab.active { border-color: currentColor; box-shadow: 0 0 4px rgba(var(--live-rgb), 0.25); }
  .live-follow { color: var(--text); }
  .live-follow.follow-on { color: var(--live); border-color: var(--live); }
  .live-skip { color: var(--warn); }
  .live-collapse { color: var(--live); min-width: 18px; text-align: center; }
  .live-body {
    margin-top: 3px;
    height: 200px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }
  .live-body::-webkit-scrollbar { width: 8px; }
  .live-body::-webkit-scrollbar-track { background: transparent; }
  .live-body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  .live-viewer.collapsed .live-body { display: none; }
  .live-tab-content { display: grid; gap: 3px; min-width: 0; }
  .live-step { display: grid; gap: 2px; min-width: 0; }
  .live-label {
    color: var(--dim);
    font-family: var(--font-display);
    font-size: 9.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .live-pre {
    margin: 0;
    padding: 2px 5px;
    background: var(--code-bg);
    color: var(--code-text);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: var(--font);
    font-size: 10.5px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .live-pre.removed {
    background: var(--code-removed-bg);
    color: var(--err);
    text-decoration: line-through;
  }
  .live-pre.added { background: var(--code-added-bg); }
  .live-pre.live-text { background: var(--panel); color: var(--text); }
  .live-sheet { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px; align-items: start; min-width: 0; }
  .live-gutter {
    margin: 0;
    padding: 2px 0;
    color: var(--dim);
    font-family: var(--font);
    font-size: 10.5px;
    line-height: 1.35;
    text-align: right;
    user-select: none;
    min-width: 18px;
  }
  .tok-comment { color: var(--code-comment); }
  .tok-string { color: var(--code-string); }
  .tok-number { color: var(--code-number); }
  .tok-keyword { color: var(--code-keyword); }
  .tok-function { color: var(--code-function); }
  .live-typing {
    color: var(--work);
    font-size: 10.5px;
    animation: live-typing 1s steps(2, jump-none) infinite;
  }
  @keyframes live-typing { 0% { opacity: 1; } 100% { opacity: 0.25; } }
  .live-notice { color: var(--warn); font-size: 10px; }
  .live-scan-line { color: var(--text); font-size: 10.5px; overflow-wrap: anywhere; }
  .live-scan-note { color: var(--dim); font-size: 10px; }
  .live-scan {
    position: relative;
    height: 2px;
    margin: 2px 0;
    background: var(--scanline);
    overflow: hidden;
  }
  .live-scan::after {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 30%;
    background: var(--live);
    opacity: 0.5;
    animation: live-scan 1.6s linear infinite;
  }
  @keyframes live-scan {
    from { transform: translateX(-100%); }
    to { transform: translateX(340%); }
  }
  :focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    #rain { display: none; }
    * { animation: none !important; transition: none !important; }
    .worker.state-done::before,
    .worker.state-error::before { display: none; }
    .worker.state-done { box-shadow: var(--glow-done-static); }
    .worker.state-error { box-shadow: var(--glow-error-static); }
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="app">
  <header class="topbar">
    <div class="topbar-line">
      <h1>Monitor</h1>
      <label class="project-picker" for="project-select">
        <span class="pc-label">PROYECTO</span>
        <select id="project-select" aria-label="Proyecto monitoreado"></select>
      </label>
      <label class="project-picker theme-picker" for="theme-select">
        <span class="pc-label">TEMA</span>
        <select id="theme-select" aria-label="Tema visual"></select>
      </label>
      <button type="button" class="bg-toggle" id="bg-toggle" aria-pressed="true">FONDO ON</button>
      <span class="link link-up" id="link" role="status">en línea</span>
      <span class="stamp" id="stamp">esperando la primera lectura…</span>
      <span class="orch" id="orch" title="">
        <span class="orch-engine" id="orch-engine">ORQUESTADOR:</span>
        <span class="orch-model" id="orch-model"></span>
      </span>
      <div class="pc" id="pc" aria-label="Carga del PC"></div>
    </div>
    <div class="usage" id="usage" aria-label="Medidores de consumo"></div>
  </header>

  <div class="notices" id="notices"></div>

  <h2 class="section-title" id="workers-title">Agentes <span class="dim" id="workers-meta"></span> <button type="button" class="hidden-toggle" id="hidden-toggle" aria-pressed="false" hidden></button></h2>
  <section class="workers" id="workers" aria-labelledby="workers-title"></section>

  <section class="git" id="git-section" aria-labelledby="git-title">
    <h2 id="git-title">Árbol de git <span class="dim" id="git-meta"></span></h2>
    <div class="git-body" id="git-body">
      <svg id="git-lines" aria-hidden="true"></svg>
      <ol class="commits" id="git-commits"></ol>
    </div>
  </section>
</div>

<script id="git-layout-logic">
  // Git tree mode decision, kept pure so the layout tests can exercise it.
  // Below one worker card (140 px) or 22 % of the viewport the tree becomes a
  // card; the 24 px margin between both thresholds is the hysteresis that
  // keeps the page from flickering between the panel and the card.
  var GIT_PANEL_MIN_PX = 140;
  var GIT_CARD_MIN_VH = 0.22;
  var GIT_MODE_HYSTERESIS_PX = 24;
  function gitCardMode(available, viewportHeight, previous) {
    var threshold = Math.max(GIT_PANEL_MIN_PX, viewportHeight * GIT_CARD_MIN_VH);
    var limit = previous === "card" ? threshold + GIT_MODE_HYSTERESIS_PX : threshold;
    return available < limit ? "card" : "panel";
  }
</script>
<script>
(function () {
  "use strict";

  var POLL_FALLBACK = 5;
  var BAR_SEGMENTS = 10;
  var ROW_H = 22;
  var LANE_W = 14;
  var PAD_X = 8;
  var PAD_Y = 11;
  var SVG_NS = "http://www.w3.org/2000/svg";
  var HIDDEN_STORAGE_KEY = "fleet-monitor.showHidden";
  var PROJECT_STORAGE_KEY = "fleet-monitor.project";
  var THEME_STORAGE_KEY = "fleet-monitor.theme";
  var BACKGROUND_STORAGE_KEY = "fleet-monitor.background";
  var DEFAULT_THEME = "matrix";
  // Theme registry: id applied as data-theme, visible name and optional
  // animated background module. Matrix is the only theme today.
  var THEMES = [{ id: "matrix", name: "Matrix", background: "matrix-rain" }];
  var snapshot = null;
  var knownShas = new Set();
  var firstRender = true;
  var gitMode = "panel";
  var showHidden = false;
  var projectId = null;
  var projectList = [];
  var defaultProjectId = null;
  var pollTimer = null;
  // The choice of showing the hidden finished cards survives the refresh; the
  // page still works when storage is unavailable (private mode, blocked).
  try {
    showHidden = window.localStorage.getItem(HIDDEN_STORAGE_KEY) === "1";
  } catch (error) {
    showHidden = false;
  }
  var currentTheme = DEFAULT_THEME;
  var backgroundEnabled = storedItem(BACKGROUND_STORAGE_KEY) !== "0";
  var activeBackground = null;
  var tokenCache = null;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
  // Persistence helpers: every storage read/write is wrapped so the page keeps
  // working with storage unavailable (private mode, blocked).
  function storedItem(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (error) {
      return null;
    }
  }
  function rememberItem(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (error) {
      // Without storage the choice lives only in this page.
    }
  }
  // The colours the script paints itself (canvas, plain-colour fallbacks) come
  // from the computed theme tokens and are re-read whenever the theme changes.
  function token(name, fallback) {
    try {
      var value = window.getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      if (value) return value;
    } catch (error) {
      // A missing computed style keeps the caller's fallback.
    }
    return fallback;
  }
  function refreshTokens() {
    tokenCache = null;
  }
  function tokens() {
    if (!tokenCache) {
      tokenCache = {
        rainGlyph: token("--rain-glyph", "rgba(0, 255, 65, 0.85)"),
        rainTrail: token("--rain-trail", "rgba(0, 0, 0, 0.08)"),
        rainFont: token("--rain-font", "15px monospace"),
        branchNeutral: token("--branch-neutral", "currentColor")
      };
    }
    return tokenCache;
  }
  function themeById(id) {
    for (var index = 0; index < THEMES.length; index += 1) {
      if (THEMES[index].id === id) return THEMES[index];
    }
    return null;
  }
  // Theme selector: the id is applied as data-theme on <html> and remembered
  // in localStorage; an unknown id always falls back to Matrix. Switching
  // theme stops the previous background and starts the new theme's module.
  function applyTheme(id) {
    var theme = themeById(id) || themeById(DEFAULT_THEME);
    currentTheme = theme.id;
    document.documentElement.setAttribute("data-theme", currentTheme);
    refreshTokens();
    var select = document.getElementById("theme-select");
    if (select) select.value = currentTheme;
    rememberItem(THEME_STORAGE_KEY, currentTheme);
    startBackground();
  }
  function renderThemeSelect() {
    var select = document.getElementById("theme-select");
    clear(select);
    THEMES.forEach(function (theme) {
      var option = document.createElement("option");
      option.value = theme.id;
      option.textContent = theme.name;
      select.appendChild(option);
    });
    select.value = currentTheme;
  }
  function stopBackground() {
    if (!activeBackground) return;
    activeBackground.stop();
    activeBackground = null;
  }
  function startBackground() {
    stopBackground();
    var theme = themeById(currentTheme);
    var module = theme && theme.background ? BACKGROUNDS[theme.background] : null;
    if (!backgroundEnabled || !module) return;
    module.start(document.getElementById("rain"), tokens());
    activeBackground = module;
  }
  function renderBackgroundToggle() {
    var button = document.getElementById("bg-toggle");
    button.textContent = backgroundEnabled ? "FONDO ON" : "FONDO OFF";
    button.setAttribute("aria-pressed", backgroundEnabled ? "true" : "false");
  }
  // Project selector: the chosen id travels as ?project= on every poll, stays
  // in the page URL and is remembered in localStorage. Every storage/history
  // access is wrapped: the page keeps working when they are unavailable.
  function urlProject() {
    try {
      return new URL(window.location.href).searchParams.get("project");
    } catch (error) {
      return null;
    }
  }
  function storedProject() {
    try {
      return window.localStorage.getItem(PROJECT_STORAGE_KEY);
    } catch (error) {
      return null;
    }
  }
  function rememberProject(id) {
    try {
      window.localStorage.setItem(PROJECT_STORAGE_KEY, id);
    } catch (error) {
      // Without storage the choice lives only in this page.
    }
    try {
      var url = new URL(window.location.href);
      url.searchParams.set("project", id);
      window.history.replaceState(null, "", url.pathname + url.search + url.hash);
    } catch (error) {
      // Without history the URL keeps whatever it had.
    }
  }
  function applyProject(id) {
    var next = id || null;
    var changed = next !== projectId;
    projectId = next;
    var select = document.getElementById("project-select");
    if (select && projectId) select.value = projectId;
    if (changed && projectId) rememberProject(projectId);
  }
  function renderProjectSelect() {
    var select = document.getElementById("project-select");
    clear(select);
    projectList.forEach(function (project) {
      var option = document.createElement("option");
      option.value = project.id;
      option.textContent = project.name || project.id;
      select.appendChild(option);
    });
    if (projectId) select.value = projectId;
  }
  // On load the URL wins over localStorage; if the remembered id no longer
  // exists (or there is no list at all) the server's default is used.
  function loadProjects() {
    fetch("/api/projects", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        projectList = (data && data.projects) || [];
        defaultProjectId = (data && data.defaultId) || (projectList[0] && projectList[0].id) || null;
        var remembered = urlProject() || storedProject();
        var known = projectList.some(function (project) {
          return project.id === remembered;
        });
        applyProject(known ? remembered : defaultProjectId);
        renderProjectSelect();
        poll();
      })
      .catch(function () {
        // Without the list the page still polls the server's first project.
        poll();
      });
  }
  function fmtClock(iso) {
    var date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleTimeString("es-AR", { hour12: false });
  }
  function fmtReset(iso) {
    if (!iso) return "";
    var left = new Date(iso).getTime() - Date.now();
    if (!(left > 0)) return "";
    var totalMinutes = Math.floor(left / 60000);
    return "↻" + Math.floor(totalMinutes / 60) + "h" + String(totalMinutes % 60).padStart(2, "0");
  }
  function relativeTime(iso) {
    var time = new Date(iso).getTime();
    if (!Number.isFinite(time)) return "";
    var minutes = Math.floor((Date.now() - time) / 60000);
    if (minutes < 1) return "ahora";
    if (minutes < 60) return "hace " + minutes + " min";
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return "hace " + hours + " h";
    return "hace " + Math.floor(hours / 24) + " d";
  }
  function levelOf(value) {
    if (value === null || value === undefined) return "ok";
    return value >= 80 ? "crit" : value >= 50 ? "warn" : "ok";
  }
  // Consumption meters: green below 70 %, amber from 70 % to 89 %, red from
  // 90 % up. The PC line keeps its own 50/80 thresholds.
  function usageLevelOf(value) {
    if (value === null || value === undefined) return "ok";
    return value >= 90 ? "crit" : value >= 70 ? "warn" : "ok";
  }
  function bar(pct, label) {
    var value = Math.max(0, Math.min(100, Number(pct) || 0));
    // From 80 % a consumption meter blinks so the quota never catches anyone off guard.
    var box = el("span", "bar bar-" + usageLevelOf(value) + (value >= 80 ? " blink-alert" : ""));
    box.setAttribute("role", "img");
    box.setAttribute("aria-label", label + ": " + Math.round(value) + " %");
    var on = Math.round((value / 100) * BAR_SEGMENTS);
    for (var i = 0; i < BAR_SEGMENTS; i++) {
      box.appendChild(el("span", i < on ? "seg seg-on" : "seg"));
    }
    return box;
  }

  function renderUsage(usages) {
    var box = document.getElementById("usage");
    clear(box);
    (usages || []).forEach(function (usage) {
      var name = usage.label || usage.id;
      var row = el("div", "usage-row" + (usage.stale ? " usage-stale" : ""));
      row.appendChild(el("span", "usage-label", name));
      if (!usage.available) {
        row.appendChild(el("span", "dim", usage.error || "sin datos"));
        box.appendChild(row);
        return;
      }
      var five = usage.fiveHour || { pct: 0 };
      var week = usage.week || { pct: 0 };
      row.appendChild(el("span", "meter-label", "5 h"));
      row.appendChild(bar(five.pct, name + " 5 h"));
      row.appendChild(el("span", "pct" + (five.pct >= 80 ? " blink-alert" : ""), Math.round(five.pct) + "%"));
      var reset = fmtReset(five.resetsAt);
      if (reset) row.appendChild(el("span", "usage-reset", reset));
      row.appendChild(el("span", "meter-label", "sem"));
      row.appendChild(bar(week.pct, name + " semana"));
      row.appendChild(el("span", "pct" + (week.pct >= 80 ? " blink-alert" : ""), Math.round(week.pct) + "%"));
      if (usage.ageText) row.appendChild(el("span", "usage-age" + (usage.stale ? " warn" : ""), usage.ageText));
      if (usage.extra) row.appendChild(el("span", /LÍMITE/.test(usage.extra) ? "warn" : "dim", usage.extra));
      box.appendChild(row);
    });
    if (!box.firstChild) box.appendChild(el("span", "empty", "Sin medidores de consumo."));
  }

  function eventLine(event) {
    var item = el("li", "event kind-" + event.kind);
    var detail = el("span", "detail", event.detail);
    detail.title = event.detail;
    item.appendChild(el("span", "ts", event.time ? fmtClock(event.time) : ""));
    item.appendChild(el("span", "kind", event.kind));
    item.appendChild(detail);
    return item;
  }

  function workerCard(worker, activityLines, hiddenCard) {
    var kind = worker.stateKind || worker.state;
    var card = el("article", "worker state-" + kind + (hiddenCard ? " worker-hidden" : ""));
    var head = el("div", "worker-head");
    head.setAttribute("aria-label", worker.title || worker.identity);
    head.appendChild(el("span", "identity", worker.identity));
    if (worker.shortTitle) head.appendChild(el("span", "task", worker.shortTitle));
    if (worker.remaining) head.appendChild(el("span", "eta", worker.remaining));
    card.appendChild(head);

    if (worker.summaryEs) {
      var summary = el("div", "worker-summary", worker.summaryEs);
      summary.title = worker.summaryEs;
      card.appendChild(summary);
    }

    var meta = el("div", "worker-meta");
    meta.appendChild(el("span", "badge badge-" + kind, worker.stateText));
    if (hiddenCard) meta.appendChild(el("span", "badge badge-hidden", "oculta"));
    meta.appendChild(el("span", "model", worker.model));
    var swatch = el("span", "branch-swatch");
    swatch.setAttribute("aria-hidden", "true");
    if (worker.branchColorIndex >= 0) {
      swatch.style.background = "var(--branch-" + worker.branchColorIndex + ")";
    } else if (typeof worker.branchColorIndex === "number") {
      swatch.style.background = "var(--branch-neutral)";
    } else if (worker.branchColor) swatch.style.background = worker.branchColor;
    if (worker.branch) swatch.title = "rama " + worker.branch;
    meta.appendChild(swatch);
    card.appendChild(meta);

    var commit = el("div", "worker-commit");
    if (worker.lastCommit) {
      var original = worker.lastCommit.subject || "";
      commit.appendChild(el("span", "", worker.lastCommit.sha + " "));
      commit.appendChild(el("span", "subject", worker.lastCommit.subjectEs || original));
      commit.title = worker.lastCommit.sha + " " + original;
    } else {
      commit.appendChild(el("span", "", "sin commit en la rama " + (worker.branch || "")));
    }
    card.appendChild(commit);

    var events = (worker.activity && worker.activity.events) || [];
    if (events.length) {
      var list = el("ul", "events");
      events.slice(-activityLines).forEach(function (event) {
        list.appendChild(eventLine(event));
      });
      card.appendChild(list);
    } else {
      card.appendChild(el("p", "empty", (worker.activity && worker.activity.notice) || "sin actividad visible"));
    }
    // The live viewer lives in its own module; it re-attaches its panel to the
    // fresh card on every refresh, so an open replay survives the 5 s poll.
    if (window.FleetLiveView) window.FleetLiveView.attach(card, worker, projectId);
    return card;
  }

  // Label of the hidden-cards button: the count when they are out of the
  // board, the action when they are already shown.
  function hiddenToggleLabel(hidden) {
    if (showHidden) return hidden === 1 ? "ocultar 1 terminada" : "ocultar " + hidden + " terminadas";
    return hidden === 1 ? "1 terminada oculta" : hidden + " terminadas ocultas";
  }

  function renderWorkers(workers, hiddenWorkers, hiddenFinished, activityLines, activityLinesTotal) {
    var box = document.getElementById("workers");
    var gitCard = document.getElementById("git-section");
    // In card mode the tree lives first in this grid; keep it in place so its
    // scroll position survives every refresh.
    Array.prototype.slice.call(box.children).forEach(function (child) {
      if (child !== gitCard) box.removeChild(child);
    });
    var list = workers || [];
    var hiddenList = hiddenWorkers || [];
    var active = list.filter(function (worker) {
      return (worker.stateKind || worker.state) === "working";
    }).length;
    var hidden = Math.max(0, Number(hiddenFinished) || hiddenList.length);
    var meta = [];
    if (list.length) meta.push(active + " activos / " + list.length + " en total");
    document.getElementById("workers-meta").textContent = meta.length ? "· " + meta.join(" · ") : "";
    // The hidden count is a discreet button: it reveals those cards right away
    // and the choice is kept in page state across refreshes.
    var toggle = document.getElementById("hidden-toggle");
    toggle.hidden = hidden === 0;
    toggle.textContent = hiddenToggleLabel(hidden);
    toggle.setAttribute("aria-pressed", showHidden ? "true" : "false");
    var cards = showHidden ? list.concat(hiddenList) : list;
    if (!cards.length) {
      box.appendChild(el("p", "empty", "No hay pistas visibles en la configuración del kit."));
      return;
    }
    // The budget shrinks with the visible cards by default; shown hidden cards
    // count towards the total.
    var budget = Number(showHidden ? activityLinesTotal : activityLines);
    if (!(budget > 0)) budget = 8;
    cards.forEach(function (worker) {
      box.appendChild(workerCard(worker, budget, showHidden && hiddenList.indexOf(worker) !== -1));
    });
  }

  function renderPc(pc) {
    var box = document.getElementById("pc");
    clear(box);
    box.appendChild(el("span", "pc-label", "PC"));
    if (!pc || (pc.cpu === null && pc.ram === null && pc.diskC === null)) {
      box.appendChild(el("span", "dim", (pc && pc.error) || "sin datos"));
      return;
    }
    [
      ["CPU", pc.cpu],
      ["RAM", pc.ram],
      ["Disco C:", pc.diskC]
    ].forEach(function (entry) {
      var level = levelOf(entry[1]);
      var item = el("span", "pc-item", entry[0] + " ");
      item.appendChild(
        el("span", "pc-value pc-" + level, entry[1] === null || entry[1] === undefined ? "?" : Math.round(entry[1]) + "%")
      );
      box.appendChild(item);
    });
  }

  function laneX(lane) {
    return PAD_X + lane * LANE_W;
  }
  // Colours come from the server (one per lane, deterministic per branch
  // name), so the graph and the worker cards share a single assignment. When
  // the row carries a palette index the graph paints the theme variable
  // (`--branch-<index>`); otherwise the server hex is the fallback. Strokes are
  // set through inline styles because var() does not resolve in attributes.
  function laneColor(commit, lane) {
    var indexes = (commit && commit.laneColorIndexes) || [];
    var index = indexes[lane];
    if (typeof index === "number") {
      return index >= 0 ? "var(--branch-" + index + ")" : "var(--branch-neutral)";
    }
    var colors = (commit && commit.laneColors) || [];
    return colors[lane] || tokens().branchNeutral;
  }
  function svgLine(svg, x1, y1, x2, y2, color) {
    var line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.style.setProperty("stroke", color);
    line.setAttribute("stroke-width", "1.6");
    line.setAttribute("stroke-linecap", "round");
    svg.appendChild(line);
  }
  function svgCurve(svg, x1, y1, x2, y2, color) {
    var path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", "M " + x1 + " " + y1 + " C " + x1 + " " + (y1 + 8) + ", " + x2 + " " + (y2 - 8) + ", " + x2 + " " + y2);
    path.setAttribute("fill", "none");
    path.style.setProperty("stroke", color);
    path.setAttribute("stroke-width", "1.6");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);
  }
  function drawCommit(svg, commit, index, isNew) {
    var y = index * ROW_H + PAD_Y;
    var before = commit.lanesBefore || [];
    var after = commit.lanesAfter || [];
    var lanes = Math.max(before.length, after.length, commit.laneCount || 1);
    for (var lane = 0; lane < lanes; lane++) {
      var x = laneX(lane);
      var hasTop = before[lane] !== null && before[lane] !== undefined;
      var hasBottom = after[lane] !== null && after[lane] !== undefined;
      if (lane === commit.lane) {
        if (hasTop) svgLine(svg, x, y - PAD_Y, x, y, laneColor(commit, lane));
        if (hasBottom) svgLine(svg, x, y, x, y + PAD_Y, laneColor(commit, lane));
      } else if (hasTop || hasBottom) {
        svgLine(svg, x, y - PAD_Y, x, y + PAD_Y, laneColor(commit, lane));
      }
    }
    (commit.parents || []).forEach(function (link) {
      if (link.lane === commit.lane) return;
      svgCurve(svg, laneX(commit.lane), y, laneX(link.lane), y + PAD_Y, laneColor(commit, link.lane));
    });
    var node = document.createElementNS(SVG_NS, "circle");
    node.setAttribute("cx", laneX(commit.lane));
    node.setAttribute("cy", y);
    node.setAttribute("r", "3.2");
    node.style.setProperty("fill", laneColor(commit, commit.lane));
    if (isNew) node.setAttribute("class", "node is-new");
    svg.appendChild(node);
  }
  function commitRow(commit, isNew) {
    var item = el("li", "commit" + (isNew ? " is-new" : ""));
    (commit.refs || []).forEach(function (ref) {
      item.appendChild(el("span", "chip chip-" + ref.kind, ref.name));
    });
    item.appendChild(el("span", "sha", commit.shortSha));
    var english = commit.subject || "";
    var subject = el("span", "subject", commit.subjectEs || english || "(sin asunto)");
    subject.title = english;
    item.appendChild(subject);
    item.appendChild(el("span", "time", relativeTime(commit.time)));
    return item;
  }
  function renderGit(git) {
    var list = document.getElementById("git-commits");
    var svg = document.getElementById("git-lines");
    var meta = document.getElementById("git-meta");
    clear(list);
    clear(svg);
    meta.textContent = "";
    var commits = (git && git.commits) || [];
    if (!commits.length) {
      list.appendChild(el("li", "git-empty", (git && git.error) || "sin datos"));
      return;
    }
    var laneCount = 1;
    commits.forEach(function (commit) {
      laneCount = Math.max(laneCount, commit.laneCount || 1);
    });
    var graphW = PAD_X * 2 + (laneCount - 1) * LANE_W;
    list.style.setProperty("--graph-w", graphW + "px");
    svg.setAttribute("width", graphW);
    svg.setAttribute("height", commits.length * ROW_H);
    svg.setAttribute("viewBox", "0 0 " + graphW + " " + commits.length * ROW_H);
    commits.forEach(function (commit, index) {
      var isNew = Boolean(commit.__isNew);
      commit.__isNew = false;
      drawCommit(svg, commit, index, isNew);
      list.appendChild(commitRow(commit, isNew));
    });
    meta.textContent = "· " + commits.length + " commits";
  }

  function renderNotices(notices) {
    var box = document.getElementById("notices");
    clear(box);
    (notices || []).forEach(function (text) {
      box.appendChild(el("div", "notice", text));
    });
  }

  // Free space a full-width git panel would get, measured from the actual
  // layout: the app's content box minus every other row and the flex gaps.
  function measurePanelSpace() {
    var app = document.querySelector(".app");
    var appStyle = window.getComputedStyle(app);
    var workers = document.getElementById("workers");
    var git = document.getElementById("git-section");
    var content = app.clientHeight
      - (parseFloat(appStyle.paddingTop) || 0)
      - (parseFloat(appStyle.paddingBottom) || 0);
    var others = 0;
    Array.prototype.slice.call(app.children).forEach(function (child) {
      if (child !== workers && child !== git) others += child.offsetHeight;
    });
    var workersHeight;
    if (gitMode === "card" && git.parentNode === workers) {
      // Out of the grid flow only while measuring, so the grid is sized as if
      // the card were already gone.
      git.classList.add("is-measuring");
      workersHeight = workers.offsetHeight;
      git.classList.remove("is-measuring");
    } else {
      workersHeight = workers.offsetHeight;
    }
    // The hypothetical panel adds one row to the app column; every row keeps
    // one gap.
    var rows = app.children.length + (git.parentNode === workers ? 1 : 0);
    var gap = parseFloat(appStyle.rowGap || appStyle.gap) || 0;
    return content - others - workersHeight - gap * (rows - 1);
  }

  // Moves the tree between the full-width panel and the first worker card.
  function applyGitLayout() {
    var git = document.getElementById("git-section");
    var workers = document.getElementById("workers");
    var app = document.querySelector(".app");
    var next = gitCardMode(measurePanelSpace(), window.innerHeight, gitMode);
    gitMode = next;
    if (next === "card") {
      git.classList.add("card");
      if (git.parentNode !== workers) workers.insertBefore(git, workers.firstChild);
    } else {
      git.classList.remove("card");
      if (git.parentNode !== app) app.appendChild(git);
    }
  }

  function render(next) {
    snapshot = next;
    // The server names the project it answered for; keep the picker in sync
    // (first poll, or a fallback after an unknown id).
    if (next.project && next.project.id && next.project.id !== projectId) {
      applyProject(next.project.id);
    }
    var commits = (next.git && next.git.commits) || [];
    commits.forEach(function (commit) {
      commit.__isNew = !firstRender && !knownShas.has(commit.sha);
    });
    knownShas = new Set(commits.map(function (commit) {
      return commit.sha;
    }));
    firstRender = false;

    var orchestrator = next.orchestrator || {};
    document.getElementById("orch-model").textContent = orchestrator.text || "";
    document.getElementById("orch").title = [orchestrator.label, orchestrator.engine].filter(Boolean).join(" · ");
    renderUsage(next.usages);
    renderWorkers(next.workers, next.hiddenWorkers, next.hiddenFinished, next.activityLines, next.activityLinesTotal);
    renderPc(next.pc);
    renderGit(next.git);
    renderNotices(next.notices);
    applyGitLayout();
    document.getElementById("stamp").textContent = "actualizado " + fmtClock(next.generatedAt);
  }

  function setLink(up) {
    var link = document.getElementById("link");
    link.textContent = up ? "en línea" : "sin conexión, reintentando";
    link.className = "link " + (up ? "link-up" : "link-down");
  }

  function schedule() {
    var seconds = (snapshot && Number(snapshot.pollSeconds)) || POLL_FALLBACK;
    pollTimer = window.setTimeout(poll, Math.max(2, seconds) * 1000);
  }

  function poll() {
    if (pollTimer) {
      window.clearTimeout(pollTimer);
      pollTimer = null;
    }
    var query = projectId ? "?project=" + encodeURIComponent(projectId) : "";
    fetch("/api/state" + query, { cache: "no-store" })
      .then(function (response) {
        if (response.status === 404 && projectId) {
          // The config no longer lists the chosen project: fall back to the
          // default and let the next poll pick it up.
          applyProject(defaultProjectId);
          throw new Error("proyecto desconocido");
        }
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        render(data);
        setLink(true);
      })
      .catch(function () {
        setLink(false);
      })
      .then(schedule);
  }

  // Animated backgrounds: one registry entry per module, each owning the single
  // full-page canvas behind the content. Modules run at most ~30 fps (the
  // Matrix rain keeps its ~20 fps), pause while the tab is hidden and never
  // start under prefers-reduced-motion. `start` receives the computed theme
  // tokens so every colour follows the active theme.
  var BACKGROUNDS = {
    "matrix-rain": (function () {
      var canvas = null;
      var context = null;
      var columns = 0;
      var drops = [];
      var frame = null;
      var last = 0;
      var palette = {};
      var running = false;
      function resize() {
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.max(1, Math.floor(canvas.width / 16));
        drops = new Array(columns).fill(0).map(function () {
          return Math.floor(Math.random() * -40);
        });
      }
      function draw(now) {
        if (!running) return;
        if (now - last >= 50) {
          last = now;
          context.fillStyle = palette.rainTrail;
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.font = palette.rainFont;
          context.fillStyle = palette.rainGlyph;
          for (var i = 0; i < columns; i++) {
            // Like the film: mirrored half-width katakana mixed with digits.
            var text = Math.random() < 0.8
              ? String.fromCharCode(0xff66 + Math.floor(Math.random() * 56))
              : String(Math.floor(Math.random() * 10));
            context.save();
            context.translate(i * 16 + 14, drops[i] * 16);
            context.scale(-1, 1);
            context.fillText(text, 0, 0);
            context.restore();
            if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
          }
        }
        frame = window.requestAnimationFrame(draw);
      }
      function onVisibilityChange() {
        if (!running) return;
        if (document.hidden) {
          if (frame) window.cancelAnimationFrame(frame);
          frame = null;
        } else if (!frame) {
          frame = window.requestAnimationFrame(draw);
        }
      }
      function onResize() {
        resize();
      }
      function start(nextCanvas, nextTokens) {
        if (!nextCanvas || !nextCanvas.getContext) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          nextCanvas.style.display = "none";
          return;
        }
        nextCanvas.style.display = "";
        canvas = nextCanvas;
        context = canvas.getContext("2d");
        palette = nextTokens || {};
        running = true;
        last = 0;
        resize();
        window.addEventListener("resize", onResize);
        document.addEventListener("visibilitychange", onVisibilityChange);
        if (!document.hidden) frame = window.requestAnimationFrame(draw);
      }
      function stop() {
        running = false;
        if (frame) window.cancelAnimationFrame(frame);
        frame = null;
        if (canvas && context) context.clearRect(0, 0, canvas.width, canvas.height);
        window.removeEventListener("resize", onResize);
        document.removeEventListener("visibilitychange", onVisibilityChange);
      }
      return { start: start, stop: stop, resize: resize };
    })()
  };

  window.addEventListener("resize", function () {
    if (!snapshot) return;
    applyGitLayout();
    renderGit(snapshot.git);
  });

  document.getElementById("project-select").addEventListener("change", function (event) {
    applyProject(event.target.value);
    poll();
  });

  document.getElementById("theme-select").addEventListener("change", function (event) {
    applyTheme(event.target.value);
  });

  document.getElementById("bg-toggle").addEventListener("click", function () {
    backgroundEnabled = !backgroundEnabled;
    rememberItem(BACKGROUND_STORAGE_KEY, backgroundEnabled ? "1" : "0");
    renderBackgroundToggle();
    startBackground();
  });

  document.getElementById("hidden-toggle").addEventListener("click", function () {
    showHidden = !showHidden;
    try {
      window.localStorage.setItem(HIDDEN_STORAGE_KEY, showHidden ? "1" : "0");
    } catch (error) {
      // Without storage the choice lives only in this page.
    }
    if (snapshot) {
      renderWorkers(
        snapshot.workers,
        snapshot.hiddenWorkers,
        snapshot.hiddenFinished,
        snapshot.activityLines,
        snapshot.activityLinesTotal
      );
    }
  });

  renderThemeSelect();
  renderBackgroundToggle();
  applyTheme(storedItem(THEME_STORAGE_KEY) || DEFAULT_THEME);
  loadProjects();
})();
</script>
<script type="module" src="/js/live-view.mjs"></script>
</body>
